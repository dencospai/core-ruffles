name: Build and check core
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --lib --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/smoke_test.py dist/windows-x64/ruffle_libretro.dll --abi-only
      - uses: actions/upload-artifact@v4
        with:
          name: ruffle-libretro-windows-x64
          path: dist/windows-x64/

  linux-integration:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo build --locked
      - run: python3 scripts/smoke_test.py target/debug/libruffle_libretro.so
      - run: python3 scripts/cursor_test.py target/debug/libruffle_libretro.so
      - run: python3 scripts/gamepad_mouse_test.py target/debug/libruffle_libretro.so

